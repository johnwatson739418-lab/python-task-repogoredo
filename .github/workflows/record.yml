name: YouTube Live Recorder
run-name: Recorder session ${{ inputs.session_id || github.run_id }} / shift ${{ inputs.shift_index || 0 }}

on:
  workflow_dispatch:
    inputs:
      total_hours:
        description: 'Hours from your manual start: 8, 9, 10, or 12 (max 14; use 0.05 for a short test)'
        required: true
        default: 10
        type: number
      release_backup:
        description: 'Backup failed Gofile uploads to GitHub Releases (public in public repos)'
        required: true
        default: true
        type: boolean
      session_start:
        description: 'Internal; leave empty for a fresh start'
        required: false
        default: ''
        type: string
      session_id:
        description: 'Internal; leave empty for a fresh start'
        required: false
        default: ''
        type: string
      shift_index:
        description: 'Internal; leave zero for a fresh start'
        required: false
        default: 0
        type: number

permissions:
  contents: read

# Duplicate dispatches for one window serialize; expired windows are skipped.
# Different window indexes may overlap as intended.
concurrency:
  group: recorder-${{ github.workflow }}-${{ inputs.session_id || github.run_id }}-${{ inputs.shift_index || 0 }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.plan.outputs.active }}
      deadline: ${{ steps.plan.outputs.deadline }}
      window_deadline: ${{ steps.plan.outputs.window_deadline }}
      chain: ${{ steps.plan.outputs.chain }}
      next_at: ${{ steps.plan.outputs.next_at }}
      next_index: ${{ steps.plan.outputs.next_index }}
      session_start: ${{ steps.plan.outputs.session_start }}
      session_id: ${{ steps.plan.outputs.session_id }}
      total_hours: ${{ steps.plan.outputs.total_hours }}
      matrix: ${{ steps.channels.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a usable cookie file before starting any shifts
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          python3 - <<'PYCODE'
          import os
          raw = os.environ.pop('YT_COOKIES', '')
          good = False
          for line in raw.splitlines():
              if line.startswith('#HttpOnly_'): line = line[len('#HttpOnly_'):]
              if not line or line.startswith('#'): continue
              fields = line.split('\t')
              domain = fields[0].lstrip('.').lower()
              if len(fields) >= 7 and (domain == 'youtube.com' or domain.endswith('.youtube.com')) and fields[-1]: good = True
          raw = ''
          if not good: raise SystemExit('YT_COOKIES is missing or malformed. Add the complete private cookie file in repository Actions secrets; no continuation shifts started.')
          print('Private cookie file binding found; values withheld. Authentication still depends on YouTube.')
          PYCODE
      - name: Plan bounded session
        id: plan
        env:
          TOTAL_HOURS: ${{ inputs.total_hours }}
          SESSION_START: ${{ inputs.session_start }}
          SESSION_ID: ${{ inputs.session_id }}
          SHIFT_INDEX: ${{ inputs.shift_index }}
        run: python3 shift_plan.py
      - name: Validate exactly one channel
        id: channels
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('channels.json', encoding='utf-8-sig') as f:
              channels = json.load(f)
          if not isinstance(channels, list) or len(channels) != 1:
              raise SystemExit('channels.json must contain exactly one channel')
          item = channels[0]
          if not isinstance(item, dict) or not isinstance(item.get('handle'), str) or not item['handle'].startswith('@'):
              raise SystemExit('A channel @handle is required')
          if item.get('id') and not isinstance(item['id'], str):
              raise SystemExit('Channel id must be a string or empty')
          print('matrix=' + json.dumps({'channel': channels}, separators=(',', ':')))
          PY

  record:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write  # Required for the enabled Release backup.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Record ${{ matrix.channel.handle }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and show actual free disk
        timeout-minutes: 15
        run: |
          set -euo pipefail
          missing=()
          for executable in ffmpeg curl rclone; do
            if ! command -v "$executable" >/dev/null; then missing+=("$executable"); fi
          done
          if ((${#missing[@]})); then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 "${missing[@]}"
          fi
          python -m pip install -q 'yt-dlp[default,curl-cffi]==2026.10.21'
          df -h .
      - name: Setup Cloudflare WARP (Anti-Bot Anycast IP)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cloudflare-warp
          sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos mode warp
          sudo warp-cli --accept-tos connect
          sleep 3
          echo "Public IP masked via Cloudflare:"
          curl -s https://ifconfig.me || true
      - name: Record current window
        id: capture
        timeout-minutes: 190
        continue-on-error: true
        env:
          CHANNEL_HANDLE: ${{ matrix.channel.handle }}
          TARGET_CHANNEL_ID: ${{ matrix.channel.id }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          SESSION_DEADLINE: ${{ needs.prepare.outputs.window_deadline }}
          OUT_DIR: streams
        run: |
          set -euo pipefail
          cookie_path="$RUNNER_TEMP/youtube-recording-cookies.txt"
          trap 'rm -f "$cookie_path"' EXIT
          if [[ -z "$YT_COOKIES" ]]; then
            echo '::error::YT_COOKIES is missing; refusing to claim an authenticated test.'
            exit 2
          fi
          python3 -c "import os; open('$cookie_path', 'w', encoding='utf-8', newline='\n').write(os.environ.get('YT_COOKIES', '').lstrip('\ufeff'))"
          export USE_COOKIES=true COOKIE_FILE="$cookie_path"
          unset YT_COOKIES
          HOURS="$(python shift_plan.py --duration-until "$SESSION_DEADLINE")"
          export HOURS
          python recorder.py
      - name: Upload to Drive first, then Gofile and Release fallback
        id: publish
        if: always() && steps.capture.outcome != 'skipped'
        timeout-minutes: 122
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_FOLDER_ID: ${{ vars.GOFILE_FOLDER_ID }}
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
          GDRIVE_REMOTE: ${{ vars.GDRIVE_REMOTE || 'drive:YouTubeRecordings' }}
          RELEASE_BACKUP: ${{ inputs.release_backup }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$RELEASE_BACKUP" == true ]]; then args+=(--release-fallback); fi
          python run_upload.py --root streams --report upload-report.json --budget 7200 "${args[@]}"
      - name: Save small diagnostics and verified upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}-${{ inputs.shift_index || 0 }}
          path: |
            upload-report.json
            streams/**/*_summary.json
          if-no-files-found: warn
          retention-days: 2
      - name: Optional Telegram text notification
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECORD_OUTCOME: ${{ steps.capture.outcome }}
          CHANNEL_HANDLE: ${{ matrix.channel.handle }}
        run: python notify_telegram.py
      - name: Report actual recording and publication status
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          UPLOAD_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          lines = ['Recording step: '+os.environ['CAPTURE_OUTCOME'], 'Upload step: '+os.environ['UPLOAD_OUTCOME']]
          path = pathlib.Path('upload-report.json')
          report = json.loads(path.read_text()) if path.exists() else {}
          files = report.get('files', [])
          if not files:
              lines.append('🟢 Shift complete: Streamer was offline throughout this window. No recording needed.')
          else:
              for item in files:
                  status_str = 'uploaded' if item.get('uploaded') else 'FAILED'
                  lines.append(f"{item['file']}: {status_str}")
                  lines.extend(r.get('url', '') for r in item.get('receipts', []))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('\n\n'.join(lines)+'\n')
          if os.environ['CAPTURE_OUTCOME'] != 'success' or os.environ['UPLOAD_OUTCOME'] != 'success':
              raise SystemExit('Recording or upload step failed with an error.')
          if files and not report.get('all_uploaded'):
              raise SystemExit('Some recorded stream files failed to upload.')
          PY

  next-shift:
    needs: prepare
    if: needs.prepare.outputs.chain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 140
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch next overlapping window
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.ref_name }}
          TOTAL_HOURS: ${{ needs.prepare.outputs.total_hours }}
          SESSION_START: ${{ needs.prepare.outputs.session_start }}
          SESSION_ID: ${{ needs.prepare.outputs.session_id }}
          NEXT_INDEX: ${{ needs.prepare.outputs.next_index }}
          NEXT_AT: ${{ needs.prepare.outputs.next_at }}
          DEADLINE: ${{ needs.prepare.outputs.deadline }}
          RELEASE_BACKUP: ${{ inputs.release_backup }}
        run: python3 chain_shift.py
