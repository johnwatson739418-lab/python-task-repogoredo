name: God-level YouTube Live Recorder

on:
  workflow_dispatch:
    inputs:
      channel_handle:
        description: "OPTIONAL – override channel (e.g. @prankurv123, @BagadBillagang-p6s, @floxiclip, @GOREDOXLIVE). Empty = channels.json"
        required: false
        default: ""
        type: string
      total_hours:
        description: "Total session length in hours (e.g. 6, 8, 9, 12; use 0.1 for 6-min test)"
        required: false
        default: "8"
        type: string
      session_start:
        description: "Internal ISO UTC start time (leave empty = now)"
        required: false
        default: ""
        type: string
      session_id:
        description: "Internal Session ID (auto-generated if empty)"
        required: false
        default: ""
        type: string
      shift_index:
        description: "Internal shift index (0-based)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: recorder-${{ github.event.inputs.channel_handle || 'default' }}-${{ github.event.inputs.session_id || github.run_id }}-${{ github.event.inputs.shift_index || '0' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      session_id: ${{ steps.plan.outputs.session_id }}
      session_start: ${{ steps.plan.outputs.session_start }}
      window_index: ${{ steps.plan.outputs.window_index }}
      window_count: ${{ steps.plan.outputs.window_count }}
      window_deadline: ${{ steps.plan.outputs.window_deadline }}
      window_duration_min: ${{ steps.plan.outputs.window_duration_min }}
      has_next: ${{ steps.plan.outputs.has_next }}
      next_shift_index: ${{ steps.plan.outputs.next_shift_index }}
      channel_handle: ${{ steps.channel.outputs.handle }}
      channel_id: ${{ steps.channel.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve channel (manual override or channels.json)
        id: channel
        run: |
          MANUAL="${{ github.event.inputs.channel_handle }}"
          if [ -n "$MANUAL" ]; then
            HANDLE="$MANUAL"
            case "$HANDLE" in
              @*|UC*) ;;
              *) HANDLE="@$HANDLE" ;;
            esac
            echo "handle=$HANDLE" >> "$GITHUB_OUTPUT"
            echo "id=" >> "$GITHUB_OUTPUT"
            echo "Using MANUAL channel override: $HANDLE"
          else
            HANDLE=$(python3 -c '
          import json
          data = json.load(open("channels.json", encoding="utf-8-sig"))
          for c in data:
              if c.get("enabled", True):
                  print(c["handle"])
                  break
          else:
              print("@BagadBillagang-p6s")
          ')
            ID=$(python3 -c '
          import json
          data = json.load(open("channels.json", encoding="utf-8-sig"))
          for c in data:
              if c.get("enabled", True):
                  print(c.get("id", ""))
                  break
          ')
            echo "handle=$HANDLE" >> "$GITHUB_OUTPUT"
            echo "id=$ID" >> "$GITHUB_OUTPUT"
            echo "Using channels.json: $HANDLE"
          fi

      - name: Plan shifts
        id: plan
        env:
          TOTAL_HOURS: ${{ github.event.inputs.total_hours || '8' }}
          SESSION_START: ${{ github.event.inputs.session_start }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
          SHIFT_INDEX: ${{ github.event.inputs.shift_index || '0' }}
        run: python3 shift_plan.py

  record:
    needs: prepare
    if: needs.prepare.outputs.window_duration_min != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: Record ${{ needs.prepare.outputs.channel_handle }} (Shift ${{ needs.prepare.outputs.window_index }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node (for yt-dlp JS challenges)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
          pip install -U pip
          pip install -r requirements.txt
          pip install -U "yt-dlp[default,curl-cffi]"
          yt-dlp --version
          rclone version

      - name: Prepare cookies (optional – never fatal)
        id: cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            python3 -c 'import os, pathlib; p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cookies.txt"; p.write_text(os.environ["YT_COOKIES"].lstrip("\ufeff"), encoding="utf-8")'
            echo "USE_COOKIES=true" >> "$GITHUB_ENV"
            echo "COOKIE_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
            echo "Cookies written (optional)"
          else
            echo "USE_COOKIES=false" >> "$GITHUB_ENV"
            echo "COOKIE_FILE=" >> "$GITHUB_ENV"
            echo "No cookies – pure mobile clients (android_vr/android/ios) will be used"
          fi

      - name: Capture window
        id: capture
        timeout-minutes: 295
        continue-on-error: true
        env:
          CHANNEL_HANDLE: ${{ needs.prepare.outputs.channel_handle }}
          TARGET_CHANNEL_ID: ${{ needs.prepare.outputs.channel_id }}
          SESSION_DEADLINE: ${{ needs.prepare.outputs.window_deadline }}
          OUT_DIR: streams
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 recorder.py
          ls -lh streams/ || true

      - name: Dispatch next shift immediately (Zero gap during upload)
        if: always() && needs.prepare.outputs.has_next == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SESSION_ID: ${{ needs.prepare.outputs.session_id }}
          SESSION_START: ${{ needs.prepare.outputs.session_start }}
          NEXT_SHIFT_INDEX: ${{ needs.prepare.outputs.next_shift_index }}
          TOTAL_HOURS: ${{ github.event.inputs.total_hours || '8' }}
          CHANNEL_HANDLE: ${{ github.event.inputs.channel_handle }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 chain_shift.py

      - name: Publish (1. Google Drive → 2. Gofile → 3. GitHub Releases)
        id: publish
        if: always()
        timeout-minutes: 55
        continue-on-error: true
        env:
          CHANNEL_HANDLE: ${{ needs.prepare.outputs.channel_handle }}
          OUT_DIR: streams
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          RCLONE_REMOTE: ${{ vars.GDRIVE_REMOTE || secrets.RCLONE_REMOTE || 'drive:YouTubeRecordings' }}
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 publish.py

      - name: Save small JSON reports (never raw video to avoid 500MB quota failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ needs.prepare.outputs.session_id }}-shift${{ needs.prepare.outputs.window_index }}
          path: |
            streams/*.json
            upload-report.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Write GitHub Step Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          lines = [f"### Recording Report: `{os.environ.get('CHANNEL_HANDLE', '')}`"]
          p = pathlib.Path("streams/upload_report.json")
          if p.exists():
              rep = json.loads(p.read_text(encoding="utf-8"))
              files = rep.get("files", [])
              if not files:
                  lines.append("🟢 **Channel was offline during this window.** No media files needed upload.")
              else:
                  lines.append(f"- **Total Recorded:** `{rep.get('total_size_gb', 0)} GB`")
                  lines.append(f"- **All Uploaded:** `{rep.get('all_uploaded')}`")
                  for f in files:
                      lines.append(f"  - `{f['file']}` ({f['size_gb']} GB) -> **{f['method']}**")
                      for lnk in f.get("links", []):
                          lines.append(f"    - {lnk}")
          else:
              lines.append("⚠️ Upload report not generated; check job logs.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
        env:
          CHANNEL_HANDLE: ${{ needs.prepare.outputs.channel_handle }}
